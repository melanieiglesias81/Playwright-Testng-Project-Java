image: mcr.microsoft.com/playwright/java:v1.44.0-jammy

stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  FEATURE:
    description: "TestNG test class to run (passed to -Dtest)"
    value: "ExampleTest2"
    options:
      - "BaseTest"
      - "ExampleTest"
      - "ExampleTest1"
      - "ExampleTest2"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

run_tests:
  stage: test
  script:
    - mvn test -B -Dheadless=true -Dtest=${FEATURE}
  artifacts:
    when: always
    paths:
      - target/surefire-reports
    expire_in: 1 week
    reports:
      junit: target/surefire-reports/TEST-*.xml
